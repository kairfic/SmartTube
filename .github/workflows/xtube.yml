name: Build Xtube

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths:
      - "xtube/**"
      - "xtube.patch"
      - "xtube.keystore.b64"
      - ".github/workflows/xtube.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Locate Xtube files
        run: |
          if [ -f xtube/xtube.patch ]; then DIR=xtube; else DIR=.; fi
          cp "$DIR/xtube.patch" /tmp/xtube.patch
          cp "$DIR/xtube.keystore.b64" /tmp/xtube.keystore.b64

      - name: Apply Xtube patch
        run: git apply --whitespace=nowarn /tmp/xtube.patch

      - name: Version name
        id: version
        run: |
          sed -i "s/versionName \"\(.*\)\"/versionName \"\1-xtube.${{ github.run_number }}\"/" smarttubetv/build.gradle
          echo "NAME=$(grep 'versionName' smarttubetv/build.gradle | head -n 1 | awk -F'"' '{print $2}')" >> $GITHUB_OUTPUT

      - name: Signing key
        run: |
          base64 --decode /tmp/xtube.keystore.b64 > ${{ github.workspace }}/xtube.keystore
          echo "storeFile=${{ github.workspace }}/xtube.keystore" > keystore.properties
          echo "storePassword=xtube-key-2026" >> keystore.properties
          echo "keyAlias=xtube" >> keystore.properties
          echo "keyPassword=xtube-key-2026" >> keystore.properties

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean assembleStfdroidRelease

      - name: Upload APK (armeabi-v7a, for SHARP TV)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Xtube_${{ steps.version.outputs.NAME }}_armeabi-v7a
          path: ./smarttubetv/build/outputs/apk/stfdroid/release/*_armeabi-v7a.apk
          if-no-files-found: error

      - name: Upload APK (universal)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Xtube_${{ steps.version.outputs.NAME }}_universal
          path: ./smarttubetv/build/outputs/apk/stfdroid/release/*_universal.apk
          if-no-files-found: error
